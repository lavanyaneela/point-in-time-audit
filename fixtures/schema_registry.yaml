# The schema registry: which columns mean what, declared once per table.
# The analyzer refuses rather than guesses. A table listed here without an
# arrival_time_column, or a joined table not listed at all, produces exit
# code 2: the question "was this knowable" is unrepresentable for it.

tables:
  events:
    kind: event
    entity_key: entity_id
    fact_time_column: fact_time
    arrival_time_column: arrival_time

  # A second event source with its own column names, so the corpus can show
  # that the contract is about meaning, not about spelling.
  incidents:
    kind: event
    entity_key: entity_id
    fact_time_column: occurred_at
    arrival_time_column: recorded_at

  # The schema most teams actually have: one mutable row per entity, one
  # timestamp, updated in place. Whether any value in it was knowable at a
  # past instant is unrepresentable, and the audit says so with exit 2
  # instead of assuming updated_at is the truth.
  crm_accounts:
    kind: event
    entity_key: entity_id
    fact_time_column: updated_at
    arrival_time_column: null

  predictions:
    kind: prediction
    entity_key: entity_id
    prediction_time_column: prediction_time
