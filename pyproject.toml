[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "point-in-time-audit"
version = "0.3.1"
description = "Finds training features that were not knowable at prediction time, measures the AUC they fabricate, and refuses when the schema cannot answer"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Lavanya Neela", email = "lavanyaneela@mycvcareer.com" }]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.1",
    "pyarrow>=14",
    "duckdb>=1.0",
    "scikit-learn>=1.4",
    "pyspark>=3.5",
    "sqlglot>=25",
    "PyYAML>=6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8",
    "pytest-cov>=5",
    "ruff>=0.6",
]
airflow = [
    "apache-airflow>=2.9",
]
kafka = [
    "confluent-kafka>=2.4",
]

[project.scripts]
pit-audit = "point_in_time_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests", "experiments", "tools"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Deliberately no "-q" here. A -q in addopts doubles with a -q flag in the CI
# counting step and strips the "::" lines that step greps for.
addopts = "--strict-markers"
markers = [
    "spark: tests that start or use the shared local SparkSession",
    "airflow: tests that import apache-airflow (optional extra)",
    "kafka: tests that need a reachable Kafka broker (optional extra)",
]

[tool.coverage.run]
source = ["point_in_time_audit"]
branch = false

[tool.coverage.report]
precision = 1
# The live Kafka consumer runs only under the optional extra and only
# against a reachable broker. Counting it in the default denominator makes
# the published percentage unreachable in the offline matrix, so it is
# excluded here and the exclusion is disclosed in the README's credibility
# line.
omit = [
    "*/point_in_time_audit/ingest/live_kafka.py",
]
